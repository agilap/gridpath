services:
  app:
    image: gridpath-backend:latest
    build:
      context: ./backend
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app

  worker:
    image: gridpath-backend:latest
    env_file:
      - .env
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}
    volumes:
      - ./backend:/app
